<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Brand mark: geometric F, drawn as rects so it never depends on a font
       being available. Colours are the CV palette: near-black on cream. -->
  <rect width="32" height="32" rx="7" fill="#0A0805"/>
  <g fill="#F8F3E8">
    <rect x="9"  y="7"  width="5"  height="18"/>
    <rect x="9"  y="7"  width="14" height="5"/>
    <rect x="9"  y="15" width="11" height="5"/>
  </g>
</svg>
